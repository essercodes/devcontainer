name: "CI - Test Features"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # neovim-config is excluded: it pulls in rust/node/python and compiles
        # tree-sitter-cli, so it is left to a manual workflow_dispatch run
        # rather than paid for on every PR.
        features:
          - claudecode
          - fzf
          - neovim
          - opencode
          - tmux
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # The tests assume the 'vscode' user, so they run against the
      # devcontainers base image rather than the CLI's ubuntu:focal default.
      - name: "Test '${{ matrix.features }}'"
        run: |
          devcontainer features test \
            --skip-scenarios \
            --project-folder ./features \
            --features ${{ matrix.features }} \
            --base-image mcr.microsoft.com/devcontainers/base:ubuntu \
            --remote-user 'ubuntu'

  test-global-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test all features installed together"
        run: |
          devcontainer features test \
            --global-scenarios-only \
            --project-folder ./features \
            --remote-user 'ubuntu'
